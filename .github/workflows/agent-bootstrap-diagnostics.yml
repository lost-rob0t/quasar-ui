name: Agent bootstrap diagnostics

on:
  push:
    branches:
      - agent-bootstraping

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > agent-test-output.txt 2>&1
          status=$?
          echo "$status" > agent-test-status.txt
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: agent-test-output
          path: |
            agent-test-output.txt
            agent-test-status.txt
          if-no-files-found: error
