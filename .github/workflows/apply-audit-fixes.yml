name: Apply audit fixes

on:
  push:
    branches:
      - agent/audit-security-integrity-fixes
    paths:
      - scripts/apply-audit-fixes.py
      - scripts/patch-audit-tests.py
      - .github/workflows/apply-audit-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-audit-fixes.py
      - scripts/patch-audit-tests.py
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-audit-security-integrity-fixes-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/audit-security-integrity-fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/audit-security-integrity-fixes
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Patch applicator replacement callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-audit-fixes.py")
          text = path.read_text(encoding="utf-8")
          before = "next_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          after = "next_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if text.count(before) != 1:
              raise SystemExit("regex replacement helper was not found exactly once")
          path.write_text(text.replace(before, after), encoding="utf-8")
          PY
      - run: python3 scripts/apply-audit-fixes.py
      - run: python3 scripts/patch-audit-tests.py
      - run: npm ci
      - name: Format maintained repository
        run: npx prettier --write .
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit applied fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply audit security and integrity fixes"
          git push origin HEAD:agent/audit-security-integrity-fixes
