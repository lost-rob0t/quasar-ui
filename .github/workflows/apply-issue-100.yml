name: Apply issue 100

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/issue-100-target-actors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-100-target-actors
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-issue-100.py
      - name: Format changed files
        run: >-
          npx prettier --write
          src/lib/actors.js
          src/lib/actors.test.js
          src/store.jsx
          src/components/DocumentEditor.jsx
          src/components/GraphPage.jsx
          e2e/target-actors.spec.ts
      - name: Commit integration
        run: |
          rm -f scripts/apply-issue-100.py .github/workflows/apply-issue-100.yml
          git config user.name lost-rob0t
          git config user.email 104283403+lost-rob0t@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'add target-driven actors and creation triggers'
          git push origin HEAD:agent/issue-100-target-actors
