name: Apply issue 99

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/issue-99-graph-destructive-ops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-99-graph-destructive-ops
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct final-suite insertion helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-issue-99.py')
          text = path.read_text()
          old = '    file.write_text(text.replace(marker, content + marker, 1))'
          new = '''    index = text.rfind(marker)\n    if index < 0:\n        raise SystemExit(f"missing append anchor in {path}: {marker!r}")\n    file.write_text(text[:index] + content + text[index:])'''
          if old not in text:
              raise SystemExit('helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python scripts/apply-issue-99.py
      - name: Format changed files
        run: >-
          npx prettier --write
          src/lib/document-delete.js
          src/lib/document-delete.test.js
          src/graph/graph-gestures.js
          src/graph/graph-gestures.test.js
          src/lib/graph-workspaces.js
          src/lib/graph-workspaces.test.js
          src/store.jsx
          src/components/Documents.jsx
          src/components/GraphPage.jsx
          src/components/OperatorUiEnhancer.jsx
          src/components/MobileGraphToolTray.jsx
          e2e/application.spec.ts
          e2e/graph-destructive-ops.spec.ts
      - name: Commit integration
        run: |
          rm -f scripts/apply-issue-99.py .github/workflows/apply-issue-99.yml
          git config user.name lost-rob0t
          git config user.email 104283403+lost-rob0t@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'fix mobile graph dragging and destructive operations'
          git push origin HEAD:agent/issue-99-graph-destructive-ops
