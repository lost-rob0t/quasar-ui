name: Capture issue 9 typecheck

on:
  push:
    branches:
      - agent/issue-9-graph-history
    paths:
      - .github/workflows/capture-issue-9-typecheck.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-9-graph-history
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck > issue-9-typecheck.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-9-typecheck.log
          git commit -m "capture issue 9 typecheck diagnostics"
          git push origin HEAD:agent/issue-9-graph-history
