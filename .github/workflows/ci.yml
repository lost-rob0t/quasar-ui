name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Melissa reimplementation sources
        run: |
          npx prettier --write docs/MELISSA_ACTORS.md
          npx prettier --write src/components/MelissaActorBridge.jsx
          npx prettier --write src/lib/melissa-personator-search.js
          sed -i 's/dob: "1982-01-01"/dob: "1982-01-01T00:00:00.000Z"/' src/lib/melissa-actor-pack-runtime.test.js
          npx prettier --write src/lib/melissa-actor-pack-runtime.test.js
      - name: Upload formatted Melissa sources
        uses: actions/upload-artifact@v7
        with:
          name: formatted-melissa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/MELISSA_ACTORS.md
            src/components/MelissaActorBridge.jsx
            src/lib/melissa-personator-search.js
            src/lib/melissa-actor-pack-runtime.test.js
          retention-days: 1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:static
      - run: npm test
      - run: npm run build
      - name: Validate application artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -q "Quasar" dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
