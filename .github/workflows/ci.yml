name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Validate application artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -q "Quasar" dist/index.html
