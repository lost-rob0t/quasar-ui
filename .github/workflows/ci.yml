name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pinned formatter
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/components/ActorManager.jsx \
            src/lib/opaque-origin-actor-host.js \
            src/lib/opaque-origin-actor-runtime.js
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/components/ActorManager.jsx \
            src/lib/opaque-origin-actor-host.js \
            src/lib/opaque-origin-actor-runtime.js
          git commit -m "Format opaque-origin actor runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:static
      - run: npm test
      - run: npm run build
      - name: Validate application artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          grep -q "Quasar" dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
