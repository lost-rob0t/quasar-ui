name: Fix issue 8 typecheck

on:
  push:
    branches:
      - agent/issue-8-command-engine
    paths:
      - .github/workflows/fix-issue-8-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-8-command-engine
      - name: Apply typed record fix and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/core/graph-commands.ts")
          source = path.read_text()
          source = source.replace(
              "cloneValue(command.patch.properties),",
              "cloneValue(command.patch.properties as Record<string, unknown>),"
          )
          source = source.replace(
              "cloneValue(command.patch.extensions)",
              "cloneValue(command.patch.extensions as Record<string, unknown>)"
          )
          path.write_text(source)
          PY
          rm -f issue-8-typecheck.log
          rm -f .github/workflows/capture-issue-8-typecheck.yml
          rm -f .github/workflows/fix-issue-8-typecheck.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix graph command patch types"
          git push origin HEAD:agent/issue-8-command-engine
