name: Fix issue 9 typecheck

on:
  push:
    branches:
      - agent/issue-9-graph-history
    paths:
      - .github/workflows/fix-issue-9-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-9-graph-history
      - name: Apply readonly command narrowing fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/core/graph-history.ts")
          source = path.read_text()
          source = source.replace(
              "if (!Array.isArray(commandOrCommands)) return cloneValue(commandOrCommands);",
              "if (!Array.isArray(commandOrCommands)) return cloneValue(commandOrCommands as GraphCommand);"
          )
          path.write_text(source)
          PY
          rm -f issue-9-typecheck.log
          rm -f .github/workflows/capture-issue-9-typecheck.yml
          rm -f .github/workflows/fix-issue-9-typecheck.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix readonly history command narrowing"
          git push origin HEAD:agent/issue-9-graph-history
