name: Format actor studio

on:
  push:
    branches:
      - agent/agents-actor-studio
    paths:
      - .github/workflows/format-actor-studio.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/agents-actor-studio
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/ActorManager.jsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ActorManager.jsx
          git commit -m "Format actor studio"
          git push origin HEAD:agent/agents-actor-studio
