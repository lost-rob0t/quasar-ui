name: Format document debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print Prettier output
        run: |
          echo '---PRETTIER-START---'
          npx prettier src/components/Documents.jsx
          echo '---PRETTIER-END---'
