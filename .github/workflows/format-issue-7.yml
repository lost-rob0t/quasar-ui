name: Format issue 7

on:
  push:
    branches:
      - agent/issue-7-graph-core

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-7-graph-core
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/core/graph-document.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/core/graph-document.test.ts
          git commit -m "format canonical graph tests"
          git push origin HEAD:agent/issue-7-graph-core
