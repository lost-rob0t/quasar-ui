name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/ui-core/map.css src/ui-core/QuasarShell.jsx e2e/graph-controls.spec.ts
          git diff -- src/ui-core/map.css src/ui-core/QuasarShell.jsx e2e/graph-controls.spec.ts
