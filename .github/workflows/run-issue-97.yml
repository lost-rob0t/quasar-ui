name: Run issue 97 integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/issue-97-dataset-picker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-97-dataset-picker
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/apply-issue-97.py
      - run: npx prettier --write src/components/GraphSelectMenu.jsx src/components/OperatorUiEnhancer.jsx src/components/MobileGraphToolTray.jsx src/operator-ui.css e2e/application.spec.ts e2e/mobile-fit-agent-disclosure.spec.ts e2e/dataset-picker.spec.ts
      - name: Commit integration
        run: |
          rm -f scripts/apply-issue-97.py
          rm -f .github/workflows/apply-issue-97.yml
          rm -f .github/workflows/run-issue-97.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wire dataset picker across graph views"
          git push origin HEAD:agent/issue-97-dataset-picker
