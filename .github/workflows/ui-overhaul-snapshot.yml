name: UI overhaul source snapshot

on:
  push:
    branches:
      - ui-core-shell-overhaul

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-core-shell-overhaul
      - uses: actions/upload-artifact@v4
        with:
          name: ui-overhaul-source
          path: |
            src
            e2e
            docs
            package.json
            package-lock.json
            playwright.config.ts
            vite.config.*
