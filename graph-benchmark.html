<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quasar graph benchmark</title>
    <style>
      html, body, #graph-benchmark-root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #07111f; color: #e5eef9; font-family: system-ui, sans-serif; }
      #graph-benchmark-root { position: relative; }
      #graph-benchmark-status { position: fixed; z-index: 10; top: 8px; left: 8px; font-size: 12px; }
      .benchmark-context-menu { position: absolute; width: 180px; height: 120px; contain: layout paint; }
    </style>
  </head>
  <body>
    <div id="graph-benchmark-root"></div>
    <output id="graph-benchmark-status">ready</output>
    <script type="module" src="/src/benchmark/graph-benchmark.js"></script>
  </body>
</html>
