<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06101d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quasar" />
    <link rel="icon" href="%BASE_URL%icons/quasar.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/quasar.svg" />
    <meta name="description" content="Quasar offline-first StarIntel investigation workspace" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Quasar</title>
  </head>
  <body>
    <div id="root">
      <section
        id="quasar-boot-status"
        style="
          box-sizing: border-box;
          width: min(34rem, calc(100% - 2rem));
          margin: 20vh auto 0;
          padding: 1.25rem;
          border: 1px solid rgba(255, 255, 255, 0.16);
          border-radius: 0.8rem;
          background: rgba(6, 16, 29, 0.92);
          color: #edf5ff;
          font: 500 1rem/1.45 system-ui, sans-serif;
        "
      >
        <strong>Loading Quasar…</strong>
        <p id="quasar-boot-message" style="margin: 0.75rem 0 0; color: #aebed0">
          Starting the local investigation workspace.
        </p>
        <button
          id="quasar-boot-repair"
          type="button"
          hidden
          style="
            margin-top: 1rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.55rem;
            background: #f2c94c;
            color: #101820;
            font: inherit;
            font-weight: 700;
          "
        >
          Repair cached app
        </button>
      </section>
    </div>
    <script>
      (() => {
        const status = document.getElementById("quasar-boot-status");
        const message = document.getElementById("quasar-boot-message");
        const repair = document.getElementById("quasar-boot-repair");
        const showFailure = (reason) => {
          if (!status?.isConnected) return;
          status.querySelector("strong").textContent = "Quasar failed to start";
          message.textContent = reason || "The production application did not mount.";
          repair.hidden = false;
        };

        window.addEventListener("error", (event) => {
          showFailure(event.error?.message || event.message);
        });
        window.addEventListener("unhandledrejection", (event) => {
          showFailure(event.reason?.message || String(event.reason || "Unhandled startup failure"));
        });
        window.setTimeout(() => showFailure("The application did not mount within 10 seconds."), 10000);

        repair.addEventListener("click", async () => {
          repair.disabled = true;
          message.textContent = "Removing the stale application shell…";
          const registrations = await navigator.serviceWorker?.getRegistrations?.();
          await Promise.all((registrations || []).map((registration) => registration.unregister()));
          const keys = await caches?.keys?.();
          await Promise.all(
            (keys || [])
              .filter((key) => key.startsWith("quasar-runtime-"))
              .map((key) => caches.delete(key))
          );
          const url = new URL(window.location.href);
          url.searchParams.set("recovered", Date.now().toString());
          window.location.replace(url.href);
        });
      })();
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
